# Fork-only CI for GDH-Technologies/MISRC-GUI.
#
# Upstream's .github/workflows/build.yml is left byte-identical to harrypm/MISRC-GUI
# and is DISABLED on this fork as a repository setting (`gh workflow disable`), not by
# editing the file -- misrc_tools/test/ci_guard_tests.py is a raw substring matcher over
# that file, so editing it risks the guards and guarantees merge conflicts on every
# upstream sync. Because that disable is invisible in the tree, it is written down in
# docs/gdh-selfhosted-ci.md. Re-enable with:
#   gh workflow enable "Build and release binary" --repo GDH-Technologies/MISRC-GUI
#
# Everything here runs on the org's own machines. `workflow-master` (label `wm`) builds
# every event. `capture-server-0` (`cs0`) and `air-0` (`air0`) join only for the refs that
# install -- pushes to main and release tags. cs0 is kept out of PR builds because it is a
# 4-core capture box and PR churn there would contend with capture work; air0 is a laptop
# that is often asleep. All three install into ~/.local/bin, so the binaries are always main.
#
# Each machine takes a different share of the deliverable, keyed on matrix.runner.os:
#
#   wm    Linux/X64   binaries + GNOME icon, .desktop entry and stale-launcher sweep
#   cs0   Linux/X64   binaries only -- headless (multi-user.target, no Xorg, no ImageMagick)
#   air0  macOS/ARM64 binaries + a real .app bundle in ~/Applications
#
# air0 is a GUI *client*: it connects over the LAN to a server on cs0 and drives that
# machine's capture hardware. macOS will not launch a bare Mach-O from the Dock or Spotlight,
# so it gets a proper bundle -- .icns, Info.plist, dylibs collected into Contents/Frameworks
# with an @executable_path rpath, ad-hoc codesigned -- mirroring upstream build.yml's
# macos-app-build job. Adding air0 also restores macOS build coverage to this fork, which had
# none while build.yml is disabled; the first run of it found two real macOS regressions.
#
# To run the GUI's *server* mode on cs0 so a client can drive its capture hardware, launch it
# under Xvfb: misrc_gui calls InitWindow unconditionally, and net_mode is honoured at startup
# only when --config is passed. That trick has no macOS equivalent, which does not matter
# while Macs are clients. See docs/gdh-selfhosted-ci.md.
#
# Release tags (v*) build and install too. misrc_tools/git-version.sh only resolves a real
# version when HEAD is at an *exact* tag, so a tag has to be built as a tag: without this
# trigger, pushing v1.1.8-gdh.2 ran nothing at all and main builds stayed dev-<date>-<sha>
# until a commit happened to coincide with a tag.
name: Self-hosted build and deploy (GDH fork)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# contents: write is required by the tag bump below, which pushes the release tag it
# creates. Nothing else here writes to the repository.
permissions:
  contents: write

# One run per ref. Without this, two quick merges could race the install step and leave
# ~/.local/bin holding a binary from the older commit.
#
# Every ref that INSTALLS (main and release tags) shares one group, because they all write
# the same ~/.local/bin. A tag pushed right after its merge is a different ref, so with a
# per-ref group it would race the main run and leave the machine holding whichever finished
# last. Sharing the group makes the later run cancel the earlier one, so the tag build
# supersedes the main build of the same commit -- the intended outcome, since the tagged
# version is what should end up installed.
concurrency:
  group: >-
    ${{ (github.event_name == 'push' &&
         (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        && 'selfhosted-install' || format('selfhosted-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------------
  # Bump the GDH release tag, so a merge to main produces a real version instead of
  # dev-<date>-<sha>. The version script resolves a version only from an EXACT tag at
  # HEAD, so the tag has to be created before anything builds.
  #
  # Pushing with the checkout-provided GITHUB_TOKEN deliberately does NOT start another
  # workflow run -- GitHub suppresses that to prevent recursion -- so this does not
  # re-trigger the tags: ['v*'] trigger and there is no double build. A tag pushed by a
  # human still triggers it, which is what that trigger is for.
  #
  # It is its own job, and it runs BEFORE any build leg.
  #
  # It used to be the second step of the single build job, which was correct while there
  # was exactly one machine. With a matrix it is not: both legs check out the same commit
  # at the same time, so if the bump stayed in the matrix, either both machines would race
  # to mint and push the same -gdh.N tag (one push wins, the loser dies on a rejected
  # push), or -- if gated to a single leg -- the other leg would have already checked out
  # before the tag existed, and the version script would resolve dev-<date>-<sha> for it.
  # Two machines would then install two different version strings for one commit.
  #
  # Hoisting it to a dependency job makes the tag exist before either leg checks out, so
  # both resolve the same version. It is minted once, on wm.
  # --------------------------------------------------------------------------------
  bump-tag:
    name: Bump GDH release tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, wm]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The version script needs tags + history to resolve a version rather than
          # falling back to dev-<date>-nogit.
          fetch-depth: 0

      - name: Bump GDH release tag
        run: |
          set -euo pipefail

          # Already tagged (a re-run of the same commit, or a merge that a human tagged
          # first): leave it alone rather than minting a second tag for one commit.
          existing="$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            echo "HEAD is already $existing; not bumping"
            exit 0
          fi

          # Nearest reachable release tag decides the base. After an upstream sync that
          # lands a plain vX.Y.Z, the next fork tag correctly restarts at -gdh.1 on the
          # new upstream version instead of continuing the old one's numbering.
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          case "$latest" in
            *-gdh.*) base="${latest%-gdh.*}"; n="${latest##*-gdh.}" ;;
            v[0-9]*) base="$latest";          n=0 ;;
            *)
              echo "::error::no reachable vX.Y.Z tag to base a GDH release tag on"
              exit 1
              ;;
          esac
          case "$n" in
            ''|*[!0-9]*) echo "::error::unparsable -gdh suffix in tag '$latest'"; exit 1 ;;
          esac

          n=$((n + 1))
          while git rev-parse -q --verify "refs/tags/${base}-gdh.${n}" >/dev/null 2>&1; do
            n=$((n + 1))
          done
          next="${base}-gdh.${n}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "auto: ${GITHUB_SHA}"
          git push origin "$next"
          echo "tagged $next"

  build-and-deploy:
    name: Build, test and install (${{ matrix.runner.name }})
    needs: [bump-tag]
    # bump-tag runs only for pushes to main; on every other event it is SKIPPED, and a
    # skipped dependency would skip this job too. Accept success or skipped, while still
    # honouring cancellation and a genuine failure of the bump.
    if: >-
      !cancelled() &&
      (needs.bump-tag.result == 'success' || needs.bump-tag.result == 'skipped')
    # Strict pin: this fork builds only on the org's own machines, never on GitHub-hosted
    # runners. wm builds every event; cs0 and air0 join only for the refs that install.
    #
    # All legs live in ONE workflow run, and `concurrency` (above) arbitrates BETWEEN
    # runs -- so the shared 'selfhosted-install' group still does the right thing: a newer
    # push to main cancels the whole older run, every leg together, rather than the legs
    # cancelling each other. That is also what keeps a leg queued behind a sleeping air0
    # from piling up: the next merge supersedes the whole stale run.
    strategy:
      # A failure on one machine must not cancel another's install.
      fail-fast: false
      matrix:
        # Each entry carries its own OS and arch labels rather than sharing one hardcoded
        # pair, because a self-hosted runner self-reports them: wm and cs0 are Linux/X64,
        # air0 is macOS/ARM64. A leg naming the wrong OS label matches no runner and sits
        # queued forever with no error -- the same silent failure as a missing runner-group
        # grant. Interpolating the labels as scalars keeps this to the one expression form
        # already used below, rather than betting on an array-valued runs-on.
        runner: >-
          ${{ fromJSON(
          (github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
          && '[{"name":"wm","os":"Linux","arch":"X64"},{"name":"cs0","os":"Linux","arch":"X64"},{"name":"air0","os":"macOS","arch":"ARM64"}]'
          || '[{"name":"wm","os":"Linux","arch":"X64"}]') }}
    runs-on: [self-hosted, "${{ matrix.runner.os }}", "${{ matrix.runner.arch }}", "${{ matrix.runner.name }}"]
    env:
      BUILD_DIR: build-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The version script needs tags + history to resolve a version rather than
          # falling back to dev-<date>-nogit. bump-tag has already pushed the tag for this
          # commit, so this checkout sees it.
          fetch-depth: 0

      # macOS only. air0's Homebrew lives at /opt/homebrew but is NOT on the runner's
      # non-interactive PATH, so meson, ninja, cmake and pkg-config are invisible without
      # this. Formulas themselves are installed by hand once (see docs/gdh-selfhosted-ci.md)
      # rather than by CI, matching how cs0's dnf packages were handled -- a missing one is
      # self-diagnosing, because build-deps-unix.sh names the formula it wants.
      - name: Set up Homebrew environment
        if: matrix.runner.os == 'macOS'
        run: |
          set -euo pipefail
          eval "$(/opt/homebrew/bin/brew shellenv)"
          {
            echo "PATH=$PATH"
            echo "HOMEBREW_PREFIX=$HOMEBREW_PREFIX"
          } >> "$GITHUB_ENV"

      - name: Resolve deps prefix
        # Deliberately OUTSIDE the runner workspace: actions/checkout defaults to
        # clean:true (git clean -ffdx), which would delete a workspace-local .deps every
        # run -- rebuilding hsdaoh+raylib each merge, and worse, leaving the installed
        # binary's RUNPATH pointing at a directory the next checkout deletes.
        #
        # The path must still contain the literal ".deps/install": ci_guard_tests.py's
        # check_built_gui_links_vendored_hsdaoh asserts that substring in ldd output.
        run: echo "MISRC_DEPS_PREFIX=$HOME/.cache/misrc/.deps/install" >> "$GITHUB_ENV"

      - name: Build vendored deps (hsdaoh + raylib)
        # Stamp-gated (build-deps-unix.sh:54) -- a warm cache exits immediately with
        # "deps already built (stamp matches)". Invoked via `bash` because the script is
        # tracked mode 100644, not 100755; scripts/build-local.sh:85 does the same.
        run: DEPS_PREFIX="$MISRC_DEPS_PREFIX" bash scripts/build-deps-unix.sh

      - name: Build misrc_gui + CLI tools
        run: bash scripts/build-local.sh --all

      - name: Guard tests
        # Full suite (not --static-only): cc, pkg-config and bash are present on wm, so the
        # runtime checks actually run instead of hard-failing.
        run: python3 misrc_tools/test/ci_guard_tests.py --post-build --gui-path "$BUILD_DIR/misrc_gui"

      - name: Smoke test
        # Headless -- the runner service has no DISPLAY, so the GUI is never opened.
        run: "\"$BUILD_DIR/misrc_gui\" --smoke-test"

      - name: Report build version
        run: |
          set -euo pipefail
          version="$("$BUILD_DIR/misrc_gui" --version)"
          echo "Built version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: built

      # ----------------------------------------------------------------------------
      # Install. Only on a real merge to main or a release tag -- PRs build and test but
      # never touch the machine's installed app.
      # ----------------------------------------------------------------------------
      - name: Install binaries to ~/.local/bin
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          set -euo pipefail
          bin_dir="$HOME/.local/bin"
          install -d "$bin_dir"

          # Replace via a temp name + mv: rename is atomic, so an install cannot fail with
          # ETXTBSY if the GUI happens to be running, and a reader never sees a half file.
          for b in misrc_gui misrc_capture misrc_extract; do
            install -m 755 "$BUILD_DIR/$b" "$bin_dir/.$b.incoming"
            mv -f "$bin_dir/.$b.incoming" "$bin_dir/$b"
            echo "installed $bin_dir/$b"
          done

      # ----------------------------------------------------------------------------
      # Desktop integration -- wm ONLY.
      #
      # cs0 is a headless Fedora Server box: it boots to multi-user.target, has no Xorg
      # and no GNOME, so an icon and a .desktop there would be launcher files no session
      # will ever read. It also has no ImageMagick, which the icon step shells out to.
      # The binaries above are the whole deliverable on cs0.
      # ----------------------------------------------------------------------------
      - name: Install desktop integration
        if: >-
          matrix.runner.name == 'wm' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          set -euo pipefail
          app_dir="$HOME/.local/share/applications"
          icon_dir="$HOME/.local/share/icons/hicolor/512x512/apps"
          bin_dir="$HOME/.local/bin"
          install -d "$app_dir" "$icon_dir"

          # Icon, only if absent (nothing here should churn it on every merge).
          if [ ! -f "$icon_dir/misrc.png" ] && [ -f assets/Icons/MISRC_Icon.png ]; then
            magick assets/Icons/MISRC_Icon.png -resize '512x512!' "$icon_dir/misrc.png"
            echo "installed icon"
          fi

          # Desktop entry, rewritten idempotently.
          #
          # StartupWMClass must equal GUI_WINDOW_CLASS_NAME in
          # misrc_tools/misrc_gui/core/misrc_gui.c. The GUI creates its window under that
          # constant, so WM_CLASS is identical for every build and does not depend on how
          # the app was started.
          #
          # This used to read `Exec=env RESOURCE_NAME=misrc_gui ...` with a matching
          # StartupWMClass=misrc_gui, back when the window title (which carries the
          # version) still fed WM_CLASS. RESOURCE_NAME only pins the *instance* half of
          # WM_CLASS, and only for a process started through this exact Exec line -- launch
          # the same binary from a terminal, a desktop shortcut or a second launcher and the
          # instance name falls back to the title, so the dock lost the icon anyway. The
          # constant class name makes the match hold however the app is started.
          cat > "$app_dir/misrc_gui.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=MISRC GUI
          Comment=Local Fedora build, installed by CI from main
          Exec=$bin_dir/misrc_gui %U
          Icon=misrc
          Categories=Utility;
          StartupWMClass=MISRC Capture
          X-GNOME-WMClass=MISRC Capture
          Terminal=false
          StartupNotify=true
          EOF

          # Sweep stale MISRC launchers this workflow did not write.
          #
          # A leftover .desktop naming an older, versioned StartupWMClass shows up as a
          # second "MISRC GUI" in the app grid and matches no window, so clicking it gives
          # the generic executable icon -- the exact symptom the constant class name above
          # exists to avoid, reintroduced by a file nobody remembers creating.
          #
          # Deliberately narrow, because this deletes files in a real home directory: only
          # *.desktop directly in $app_dir, only ones whose StartupWMClass names a MISRC
          # class that cannot match our window (a versioned "MISRC Capture <ver>", or the
          # retired misrc_gui/misrc-gui RESOURCE_NAME shim values), and never the entry
          # just written above. A launcher with the correct StartupWMClass is left alone,
          # and anything not naming a MISRC class is never even considered.
          shopt -s nullglob
          for stale in "$app_dir"/*.desktop; do
            if [ "$stale" = "$app_dir/misrc_gui.desktop" ]; then
              continue
            fi
            stale_class="$(sed -n 's/^StartupWMClass=//p' "$stale" | head -n1)"
            case "$stale_class" in
              "MISRC Capture "*|misrc_gui|misrc-gui)
                echo "removing stale MISRC launcher: $stale (StartupWMClass=$stale_class)"
                rm -f "$stale"
                ;;
            esac
          done
          shopt -u nullglob

          update-desktop-database "$app_dir" || true

      # ----------------------------------------------------------------------------
      # macOS app bundle -- air0 ONLY.
      #
      # macOS will not launch a bare Mach-O from the Dock, Finder or Spotlight, and air0
      # exists to be a GUI client you pick up and use. So it gets a real bundle instead of
      # the .desktop entry wm gets.
      #
      # The bundling below is lifted from upstream build.yml's macos-app-build job, minus
      # the parts that only serve a release: no lipo universal merge (air0 is arm64 and
      # installs in place), no hdiutil DMG, no artifact upload. Keeping the rest identical
      # means this leg exercises the same bundling the release DMG depends on -- coverage
      # this fork otherwise has none of, since build.yml is disabled.
      #
      # Dylibs are collected into Contents/Frameworks and rewritten to @rpath even though
      # air0 has the Homebrew originals right there, because a bundle that silently depends
      # on /opt/homebrew is exactly what the portability assertion at the end exists to
      # catch before it reaches a release.
      # ----------------------------------------------------------------------------
      - name: Install macOS app bundle
        if: >-
          matrix.runner.os == 'macOS' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          BUILT_VERSION: ${{ steps.built.outputs.version }}
        run: |
          set -euo pipefail
          DEPS_PREFIX="$MISRC_DEPS_PREFIX"
          BREW_PREFIX="$(brew --prefix)"

          APP_STAGE="$RUNNER_TEMP/MISRC.app"
          APP_ROOT="$APP_STAGE/Contents"
          FW_DIR="$APP_ROOT/Frameworks"
          rm -rf "$APP_STAGE"
          mkdir -p "$APP_ROOT/MacOS" "$APP_ROOT/Resources" "$FW_DIR"

          # .icns is the only icon format the Dock and Finder read.
          ICON_SRC="assets/Icons/MISRC_Icon.png"
          test -f "$ICON_SRC"
          ICONSET_DIR="$RUNNER_TEMP/MISRC.iconset"
          rm -rf "$ICONSET_DIR"
          mkdir -p "$ICONSET_DIR"
          sips -z 16 16     "$ICON_SRC" --out "$ICONSET_DIR/icon_16x16.png"      >/dev/null
          sips -z 32 32     "$ICON_SRC" --out "$ICONSET_DIR/icon_16x16@2x.png"   >/dev/null
          sips -z 32 32     "$ICON_SRC" --out "$ICONSET_DIR/icon_32x32.png"      >/dev/null
          sips -z 64 64     "$ICON_SRC" --out "$ICONSET_DIR/icon_32x32@2x.png"   >/dev/null
          sips -z 128 128   "$ICON_SRC" --out "$ICONSET_DIR/icon_128x128.png"    >/dev/null
          sips -z 256 256   "$ICON_SRC" --out "$ICONSET_DIR/icon_128x128@2x.png" >/dev/null
          sips -z 256 256   "$ICON_SRC" --out "$ICONSET_DIR/icon_256x256.png"    >/dev/null
          sips -z 512 512   "$ICON_SRC" --out "$ICONSET_DIR/icon_256x256@2x.png" >/dev/null
          sips -z 512 512   "$ICON_SRC" --out "$ICONSET_DIR/icon_512x512.png"    >/dev/null
          sips -z 1024 1024 "$ICON_SRC" --out "$ICONSET_DIR/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET_DIR" -o "$APP_ROOT/Resources/MISRC.icns"
          rm -rf "$ICONSET_DIR"

          cp "$BUILD_DIR/misrc_gui"     "$APP_ROOT/MacOS/MISRC"
          cp "$BUILD_DIR/misrc_capture" "$APP_ROOT/MacOS/misrc_capture"
          cp "$BUILD_DIR/misrc_extract" "$APP_ROOT/MacOS/misrc_extract"
          chmod +x "$APP_ROOT/MacOS/MISRC" "$APP_ROOT/MacOS/misrc_capture" "$APP_ROOT/MacOS/misrc_extract"

          # Quoted heredoc: the version is substituted afterwards with BSD sed rather than
          # interpolated, so a tag-derived string can never be evaluated by the shell.
          cat > "$APP_ROOT/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MISRC</string>
            <key>CFBundleDisplayName</key><string>MISRC</string>
            <key>CFBundleIdentifier</key><string>dev.misrc.gui</string>
            <key>CFBundleVersion</key><string>__BUILD_VERSION__</string>
            <key>CFBundleShortVersionString</key><string>__BUILD_VERSION__</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>MISRC</string>
            <key>CFBundleIconFile</key><string>MISRC</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/__BUILD_VERSION__/${BUILT_VERSION}/g" "$APP_ROOT/Info.plist"

          shopt -s nullglob
          is_system_lib() {
            case "$1" in
              /System/*|/usr/lib/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          resolve_dep_path() {
            local dep="$1"
            if [[ "$dep" == @rpath/* ]]; then
              local name="${dep#@rpath/}"
              local candidates=(
                "$DEPS_PREFIX/lib/$name"
                "$DEPS_PREFIX/lib64/$name"
                "$BREW_PREFIX/lib/$name"
                $BREW_PREFIX/opt/*/lib/"$name"
              )
              local candidate
              for candidate in "${candidates[@]}"; do
                if [[ -f "$candidate" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
                fi
              done
              return 1
            fi
            printf '%s\n' "$dep"
          }

          collect_dep_tree() {
            local dep="$1"
            if is_system_lib "$dep"; then
              return 0
            fi
            local resolved
            resolved="$(resolve_dep_path "$dep")" || {
              echo "Unable to resolve dylib dependency: $dep" >&2
              return 1
            }
            local base
            base="$(basename "$resolved")"
            if [[ ! -f "$FW_DIR/$base" ]]; then
              cp "$resolved" "$FW_DIR/$base"
              chmod +w "$FW_DIR/$base"
              install_name_tool -id "@rpath/$base" "$FW_DIR/$base"
              while IFS= read -r subdep; do
                collect_dep_tree "$subdep"
              done < <(otool -L "$FW_DIR/$base" | tail -n +2 | awk '{print $1}')
            fi
          }

          patch_macho_refs() {
            local target="$1"
            chmod +w "$target" || true
            while IFS= read -r dep; do
              if is_system_lib "$dep"; then
                continue
              fi
              local base
              if [[ "$dep" == @rpath/* ]]; then
                base="$(basename "${dep#@rpath/}")"
              else
                base="$(basename "$dep")"
              fi
              if [[ -f "$FW_DIR/$base" ]]; then
                install_name_tool -change "$dep" "@rpath/$base" "$target" || true
              fi
            done < <(otool -L "$target" | tail -n +2 | awk '{print $1}')
          }

          for BIN in "$APP_ROOT/MacOS/MISRC" "$APP_ROOT/MacOS/misrc_capture" "$APP_ROOT/MacOS/misrc_extract"; do
            while IFS= read -r dep; do
              collect_dep_tree "$dep"
            done < <(otool -L "$BIN" | tail -n +2 | awk '{print $1}')
          done

          for BIN in "$APP_ROOT/MacOS/MISRC" "$APP_ROOT/MacOS/misrc_capture" "$APP_ROOT/MacOS/misrc_extract"; do
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$BIN" 2>/dev/null || true
            patch_macho_refs "$BIN"
          done
          for DYLIB in "$FW_DIR"/*.dylib; do
            patch_macho_refs "$DYLIB"
          done

          # A bundle that still names a Homebrew path is not self-contained.
          for BIN in MISRC misrc_capture misrc_extract; do
            if otool -L "$APP_ROOT/MacOS/$BIN" | grep -E '/opt/homebrew|/usr/local/opt'; then
              echo "::error::non-portable Homebrew dylib path in $BIN"
              exit 1
            fi
          done

          # Ad-hoc signature. Enough for Gatekeeper here because the bundle is built in
          # place and never downloaded, so it carries no com.apple.quarantine attribute.
          codesign --force --deep --sign - "$APP_STAGE"

          "$APP_ROOT/MacOS/MISRC" --smoke-test

          # Swap into ~/Applications via a staged copy, so an interrupted install never
          # leaves a half-written bundle where the Dock will find it. Replacing a running
          # app is safe on macOS -- the running image keeps its inode.
          app_dir="$HOME/Applications"
          mkdir -p "$app_dir"
          rm -rf "$app_dir/MISRC.app.incoming" "$app_dir/MISRC.app.old"
          cp -R "$APP_STAGE" "$app_dir/MISRC.app.incoming"
          if [ -d "$app_dir/MISRC.app" ]; then
            mv "$app_dir/MISRC.app" "$app_dir/MISRC.app.old"
          fi
          mv "$app_dir/MISRC.app.incoming" "$app_dir/MISRC.app"
          rm -rf "$app_dir/MISRC.app.old"
          echo "installed $app_dir/MISRC.app"

      - name: Verify install
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        # Passed through env rather than interpolated into the script: ${{ }} expansion
        # happens before the shell sees the line, so a value containing shell syntax
        # would execute. The version derives from a tag name, so treat it as untrusted.
        env:
          BUILT_VERSION: ${{ steps.built.outputs.version }}
        run: |
          set -euo pipefail
          installed="$("$HOME/.local/bin/misrc_gui" --version)"
          built="$BUILT_VERSION"
          if [ "$installed" != "$built" ]; then
            echo "::error::installed version ($installed) does not match built version ($built)"
            exit 1
          fi
          "$HOME/.local/bin/misrc_gui" --smoke-test
          echo "Installed and verified: $installed"
          {
            echo "### Deployed to \`${{ matrix.runner.name }}\`"
            echo
            echo "- version: \`$installed\`"
            echo "- binaries: \`misrc_gui\`, \`misrc_capture\`, \`misrc_extract\` in \`~/.local/bin\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # On macOS the bundle is the deliverable, so verify it independently of the
          # bare binaries: the version it reports must match, and it must actually run.
          if [ "${{ matrix.runner.os }}" = "macOS" ]; then
            app_bin="$HOME/Applications/MISRC.app/Contents/MacOS/MISRC"
            app_version="$("$app_bin" --version)"
            if [ "$app_version" != "$built" ]; then
              echo "::error::app bundle version ($app_version) does not match built version ($built)"
              exit 1
            fi
            "$app_bin" --smoke-test
            echo "- app bundle: \`~/Applications/MISRC.app\`" >> "$GITHUB_STEP_SUMMARY"
          fi
