# Fork-only CI for GDH-Technologies/MISRC-GUI.
#
# Upstream's .github/workflows/build.yml is left byte-identical to harrypm/MISRC-GUI
# and is DISABLED on this fork as a repository setting (`gh workflow disable`), not by
# editing the file -- misrc_tools/test/ci_guard_tests.py is a raw substring matcher over
# that file, so editing it risks the guards and guarantees merge conflicts on every
# upstream sync. Because that disable is invisible in the tree, it is written down in
# docs/gdh-selfhosted-ci.md. Re-enable with:
#   gh workflow enable "Build and release binary" --repo GDH-Technologies/MISRC-GUI
#
# Everything here runs on the org's own machines. `workflow-master` (label `wm`) builds
# every event. `capture-server-0` (label `cs0`) joins only for the refs that install --
# pushes to main and release tags -- because it is a 4-core capture box and PR churn there
# would contend with capture work. Both machines install the built binaries into
# ~/.local/bin, so the app launched from the GNOME shortcut on wm and the binaries used for
# capture on cs0 are always main.
#
# cs0 is headless (multi-user.target, no Xorg installed), so it takes the binaries only:
# the icon, the .desktop entry and the stale-launcher sweep are gated to wm. That is enough
# for the CLI tools and for the GUI's own headless paths (--smoke-test returns before
# InitWindow). To run the GUI's *server* mode on cs0 so a client on wm can drive its capture
# hardware, launch it under Xvfb: misrc_gui calls InitWindow unconditionally, and net_mode
# is honoured at startup only when --config is passed. See docs/gdh-selfhosted-ci.md.
#
# Release tags (v*) build and install too. misrc_tools/git-version.sh only resolves a real
# version when HEAD is at an *exact* tag, so a tag has to be built as a tag: without this
# trigger, pushing v1.1.8-gdh.2 ran nothing at all and main builds stayed dev-<date>-<sha>
# until a commit happened to coincide with a tag.
name: Self-hosted build and deploy (GDH fork)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# contents: write is required by the tag bump below, which pushes the release tag it
# creates. Nothing else here writes to the repository.
permissions:
  contents: write

# One run per ref. Without this, two quick merges could race the install step and leave
# ~/.local/bin holding a binary from the older commit.
#
# Every ref that INSTALLS (main and release tags) shares one group, because they all write
# the same ~/.local/bin. A tag pushed right after its merge is a different ref, so with a
# per-ref group it would race the main run and leave the machine holding whichever finished
# last. Sharing the group makes the later run cancel the earlier one, so the tag build
# supersedes the main build of the same commit -- the intended outcome, since the tagged
# version is what should end up installed.
concurrency:
  group: >-
    ${{ (github.event_name == 'push' &&
         (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        && 'selfhosted-install' || format('selfhosted-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------------
  # Bump the GDH release tag, so a merge to main produces a real version instead of
  # dev-<date>-<sha>. The version script resolves a version only from an EXACT tag at
  # HEAD, so the tag has to be created before anything builds.
  #
  # Pushing with the checkout-provided GITHUB_TOKEN deliberately does NOT start another
  # workflow run -- GitHub suppresses that to prevent recursion -- so this does not
  # re-trigger the tags: ['v*'] trigger and there is no double build. A tag pushed by a
  # human still triggers it, which is what that trigger is for.
  #
  # It is its own job, and it runs BEFORE any build leg.
  #
  # It used to be the second step of the single build job, which was correct while there
  # was exactly one machine. With a matrix it is not: both legs check out the same commit
  # at the same time, so if the bump stayed in the matrix, either both machines would race
  # to mint and push the same -gdh.N tag (one push wins, the loser dies on a rejected
  # push), or -- if gated to a single leg -- the other leg would have already checked out
  # before the tag existed, and the version script would resolve dev-<date>-<sha> for it.
  # Two machines would then install two different version strings for one commit.
  #
  # Hoisting it to a dependency job makes the tag exist before either leg checks out, so
  # both resolve the same version. It is minted once, on wm.
  # --------------------------------------------------------------------------------
  bump-tag:
    name: Bump GDH release tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, wm]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The version script needs tags + history to resolve a version rather than
          # falling back to dev-<date>-nogit.
          fetch-depth: 0

      - name: Bump GDH release tag
        run: |
          set -euo pipefail

          # Already tagged (a re-run of the same commit, or a merge that a human tagged
          # first): leave it alone rather than minting a second tag for one commit.
          existing="$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            echo "HEAD is already $existing; not bumping"
            exit 0
          fi

          # Nearest reachable release tag decides the base. After an upstream sync that
          # lands a plain vX.Y.Z, the next fork tag correctly restarts at -gdh.1 on the
          # new upstream version instead of continuing the old one's numbering.
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          case "$latest" in
            *-gdh.*) base="${latest%-gdh.*}"; n="${latest##*-gdh.}" ;;
            v[0-9]*) base="$latest";          n=0 ;;
            *)
              echo "::error::no reachable vX.Y.Z tag to base a GDH release tag on"
              exit 1
              ;;
          esac
          case "$n" in
            ''|*[!0-9]*) echo "::error::unparsable -gdh suffix in tag '$latest'"; exit 1 ;;
          esac

          n=$((n + 1))
          while git rev-parse -q --verify "refs/tags/${base}-gdh.${n}" >/dev/null 2>&1; do
            n=$((n + 1))
          done
          next="${base}-gdh.${n}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "auto: ${GITHUB_SHA}"
          git push origin "$next"
          echo "tagged $next"

  build-and-deploy:
    name: Build, test and install (${{ matrix.runner }})
    needs: [bump-tag]
    # bump-tag runs only for pushes to main; on every other event it is SKIPPED, and a
    # skipped dependency would skip this job too. Accept success or skipped, while still
    # honouring cancellation and a genuine failure of the bump.
    if: >-
      !cancelled() &&
      (needs.bump-tag.result == 'success' || needs.bump-tag.result == 'skipped')
    # Strict pin: this fork builds only on the org's own machines, never on GitHub-hosted
    # runners. wm builds every event; cs0 joins only for the refs that install.
    #
    # Both legs live in ONE workflow run, and `concurrency` (above) arbitrates BETWEEN
    # runs -- so the shared 'selfhosted-install' group still does the right thing: a newer
    # push to main cancels the whole older run, both legs together, rather than the legs
    # cancelling each other.
    strategy:
      # A failure on cs0 must not cancel wm's install, or vice versa.
      fail-fast: false
      matrix:
        runner: >-
          ${{ fromJSON(
          (github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
          && '["wm","cs0"]' || '["wm"]') }}
    runs-on: [self-hosted, Linux, X64, "${{ matrix.runner }}"]
    env:
      BUILD_DIR: build-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The version script needs tags + history to resolve a version rather than
          # falling back to dev-<date>-nogit. bump-tag has already pushed the tag for this
          # commit, so this checkout sees it.
          fetch-depth: 0

      - name: Resolve deps prefix
        # Deliberately OUTSIDE the runner workspace: actions/checkout defaults to
        # clean:true (git clean -ffdx), which would delete a workspace-local .deps every
        # run -- rebuilding hsdaoh+raylib each merge, and worse, leaving the installed
        # binary's RUNPATH pointing at a directory the next checkout deletes.
        #
        # The path must still contain the literal ".deps/install": ci_guard_tests.py's
        # check_built_gui_links_vendored_hsdaoh asserts that substring in ldd output.
        run: echo "MISRC_DEPS_PREFIX=$HOME/.cache/misrc/.deps/install" >> "$GITHUB_ENV"

      - name: Build vendored deps (hsdaoh + raylib)
        # Stamp-gated (build-deps-unix.sh:54) -- a warm cache exits immediately with
        # "deps already built (stamp matches)". Invoked via `bash` because the script is
        # tracked mode 100644, not 100755; scripts/build-local.sh:85 does the same.
        run: DEPS_PREFIX="$MISRC_DEPS_PREFIX" bash scripts/build-deps-unix.sh

      - name: Build misrc_gui + CLI tools
        run: bash scripts/build-local.sh --all

      - name: Guard tests
        # Full suite (not --static-only): cc, pkg-config and bash are present on wm, so the
        # runtime checks actually run instead of hard-failing.
        run: python3 misrc_tools/test/ci_guard_tests.py --post-build --gui-path "$BUILD_DIR/misrc_gui"

      - name: Smoke test
        # Headless -- the runner service has no DISPLAY, so the GUI is never opened.
        run: "\"$BUILD_DIR/misrc_gui\" --smoke-test"

      - name: Report build version
        run: |
          set -euo pipefail
          version="$("$BUILD_DIR/misrc_gui" --version)"
          echo "Built version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: built

      # ----------------------------------------------------------------------------
      # Install. Only on a real merge to main or a release tag -- PRs build and test but
      # never touch the machine's installed app.
      # ----------------------------------------------------------------------------
      - name: Install binaries to ~/.local/bin
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          set -euo pipefail
          bin_dir="$HOME/.local/bin"
          install -d "$bin_dir"

          # Replace via a temp name + mv: rename is atomic, so an install cannot fail with
          # ETXTBSY if the GUI happens to be running, and a reader never sees a half file.
          for b in misrc_gui misrc_capture misrc_extract; do
            install -m 755 "$BUILD_DIR/$b" "$bin_dir/.$b.incoming"
            mv -f "$bin_dir/.$b.incoming" "$bin_dir/$b"
            echo "installed $bin_dir/$b"
          done

      # ----------------------------------------------------------------------------
      # Desktop integration -- wm ONLY.
      #
      # cs0 is a headless Fedora Server box: it boots to multi-user.target, has no Xorg
      # and no GNOME, so an icon and a .desktop there would be launcher files no session
      # will ever read. It also has no ImageMagick, which the icon step shells out to.
      # The binaries above are the whole deliverable on cs0.
      # ----------------------------------------------------------------------------
      - name: Install desktop integration
        if: >-
          matrix.runner == 'wm' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          set -euo pipefail
          app_dir="$HOME/.local/share/applications"
          icon_dir="$HOME/.local/share/icons/hicolor/512x512/apps"
          bin_dir="$HOME/.local/bin"
          install -d "$app_dir" "$icon_dir"

          # Icon, only if absent (nothing here should churn it on every merge).
          if [ ! -f "$icon_dir/misrc.png" ] && [ -f assets/Icons/MISRC_Icon.png ]; then
            magick assets/Icons/MISRC_Icon.png -resize '512x512!' "$icon_dir/misrc.png"
            echo "installed icon"
          fi

          # Desktop entry, rewritten idempotently.
          #
          # StartupWMClass must equal GUI_WINDOW_CLASS_NAME in
          # misrc_tools/misrc_gui/core/misrc_gui.c. The GUI creates its window under that
          # constant, so WM_CLASS is identical for every build and does not depend on how
          # the app was started.
          #
          # This used to read `Exec=env RESOURCE_NAME=misrc_gui ...` with a matching
          # StartupWMClass=misrc_gui, back when the window title (which carries the
          # version) still fed WM_CLASS. RESOURCE_NAME only pins the *instance* half of
          # WM_CLASS, and only for a process started through this exact Exec line -- launch
          # the same binary from a terminal, a desktop shortcut or a second launcher and the
          # instance name falls back to the title, so the dock lost the icon anyway. The
          # constant class name makes the match hold however the app is started.
          cat > "$app_dir/misrc_gui.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=MISRC GUI
          Comment=Local Fedora build, installed by CI from main
          Exec=$bin_dir/misrc_gui %U
          Icon=misrc
          Categories=Utility;
          StartupWMClass=MISRC Capture
          X-GNOME-WMClass=MISRC Capture
          Terminal=false
          StartupNotify=true
          EOF

          # Sweep stale MISRC launchers this workflow did not write.
          #
          # A leftover .desktop naming an older, versioned StartupWMClass shows up as a
          # second "MISRC GUI" in the app grid and matches no window, so clicking it gives
          # the generic executable icon -- the exact symptom the constant class name above
          # exists to avoid, reintroduced by a file nobody remembers creating.
          #
          # Deliberately narrow, because this deletes files in a real home directory: only
          # *.desktop directly in $app_dir, only ones whose StartupWMClass names a MISRC
          # class that cannot match our window (a versioned "MISRC Capture <ver>", or the
          # retired misrc_gui/misrc-gui RESOURCE_NAME shim values), and never the entry
          # just written above. A launcher with the correct StartupWMClass is left alone,
          # and anything not naming a MISRC class is never even considered.
          shopt -s nullglob
          for stale in "$app_dir"/*.desktop; do
            if [ "$stale" = "$app_dir/misrc_gui.desktop" ]; then
              continue
            fi
            stale_class="$(sed -n 's/^StartupWMClass=//p' "$stale" | head -n1)"
            case "$stale_class" in
              "MISRC Capture "*|misrc_gui|misrc-gui)
                echo "removing stale MISRC launcher: $stale (StartupWMClass=$stale_class)"
                rm -f "$stale"
                ;;
            esac
          done
          shopt -u nullglob

          update-desktop-database "$app_dir" || true

      - name: Verify install
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        # Passed through env rather than interpolated into the script: ${{ }} expansion
        # happens before the shell sees the line, so a value containing shell syntax
        # would execute. The version derives from a tag name, so treat it as untrusted.
        env:
          BUILT_VERSION: ${{ steps.built.outputs.version }}
        run: |
          set -euo pipefail
          installed="$("$HOME/.local/bin/misrc_gui" --version)"
          built="$BUILT_VERSION"
          if [ "$installed" != "$built" ]; then
            echo "::error::installed version ($installed) does not match built version ($built)"
            exit 1
          fi
          "$HOME/.local/bin/misrc_gui" --smoke-test
          echo "Installed and verified: $installed"
          {
            echo "### Deployed to \`${{ matrix.runner }}\`"
            echo
            echo "- version: \`$installed\`"
            echo "- binaries: \`misrc_gui\`, \`misrc_capture\`, \`misrc_extract\` in \`~/.local/bin\`"
          } >> "$GITHUB_STEP_SUMMARY"
